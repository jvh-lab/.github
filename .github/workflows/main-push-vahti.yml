# Main-push-vahti (agent-foundation D023 J2): jokaisen mainiin tulevan commitin on tultava yhdistetyn
# PR:n kautta. Suora push (myös PR-haaran push mainiin tai pakotettu push) kaataa ajon ja avaa tai
# kommentoi issueta "Suora push mainiin" (yksi avoin). Jälkitarkistus ei estä pushia. Ajo on jvh-labin
# omalla Linux-ajurilla; org-muuttuja JVH_LAB_LINUX_RUNS_ON (esim. '"ubuntu-latest"') voi palauttaa
# sen GitHubiin. Tiedosto ja .github/scripts/main_push_vahti.py ovat tavulleen samat kaikissa
# jvh-labin repoissa. project-templaten template/-kopio ajetaan GitHubin ubuntu-latestilla, koska
# pohjasta luodaan projekteja muihin organisaatioihin. Itsetesti ajetaan PR:ssä vain, kun vahdin
# tiedostot muuttuvat.
name: main-push-vahti

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/main-push-vahti.yml
      - .github/scripts/main_push_vahti.py
      - .github/scripts/test_main_push_vahti.py

permissions: {}

concurrency:
  group: main-push-vahti-${{ github.event_name }}
  cancel-in-progress: false
  queue: max

jobs:
  vahti:
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.JVH_LAB_LINUX_RUNS_ON || '["self-hosted","Linux","X64","jvh-lab-linux"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: read
    steps:
      # Skripti haetaan mainin edellisestä kärjestä, jotta suora push ei muuta omaa tarkistustaan.
      # Jos sitä ei ole (vahdin ensimmäinen ajo tai main luotiin), käytetään pushattua versiota.
      # Haun epäonnistuminen raportoidaan (VAHTI_EDELLINEN_CHECKOUT).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: edellinen
        if: github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        with:
          ref: ${{ github.event.before }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: hashFiles('.github/scripts/main_push_vahti.py') == ''
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Vaihe "tarkistus" onnistuu, kun tarkistus valmistui (myös hälytys), ja kirjoittaa
      # tuloksen. Vaihe "tarkistuspiste" ajetaan vain silloin, ja seuraava ajo käyttää sitä
      # pisteenään. Keskeneräinen tarkistus kaataa vaiheen "tarkistus".
      - name: tarkistus
        id: tarkistus
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VAHTI_EDELLINEN_CHECKOUT: ${{ steps.edellinen.outcome }}
        run: python3 .github/scripts/main_push_vahti.py
      - name: tarkistuspiste
        if: steps.tarkistus.outputs.tulos != ''
        run: echo "Tarkistus valmistui, ja ajo on seuraavan ajon tarkistuspiste."
      - name: hälytys
        if: steps.tarkistus.outputs.tulos == 'violation' || steps.tarkistus.outputs.tulos == 'gap'
        run: |
          echo "::error title=main-push-vahti::Hälytys, ks. issue Suora push mainiin."
          exit 1

  itsetesti:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.JVH_LAB_LINUX_RUNS_ON || '["self-hosted","Linux","X64","jvh-lab-linux"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: fixture-testit
        run: python3 -m unittest discover -s .github/scripts -p test_main_push_vahti.py -v
